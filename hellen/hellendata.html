<!DOCTYPE html>
<html>

<head>
    <title>Contact Form</title>

    <style>
        body {
            background-color: #f4ece6;
            font-family: Arial;
        }

        .form {
            background-color: white;
            width: 60%;
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            border-top: 5px solid #8b2e2e;
        }

        h1 {
            text-align: center;
            color: #8b2e2e;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-spacing: 10px;
        }

        td {
            padding: 5px;
            vertical-align: top;
        }

        input[type="text"],
        input[type="email"] {
            width: 95%;
            padding: 10px;
            border: 1px solid #c9b8ad;
            border-radius: 5px;
        }

        textarea {
            width: 95%;
            padding: 10px;
            height: 180px;
            border: 1px solid #c9b8ad;
            border-radius: 5px;
        }

        button {
            background-color: #8b2e2e;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6f2323;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: white;
            border: 1px solid #8b2e2e;
            border-radius: 5px;
            text-decoration: none;
            color: #8b2e2e;
            font-weight: bold;
            font-size: 14px;
        }

        .back-btn:hover {
            background-color: #f4ece6;
        }

        footer {
            background-color: #8b2e2e;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="form">

        <h1>CONTACT ME</h1>

        <form action="mailto:hellen@gmail.com" method="post" enctype="text/plain">

            <table>

                <tr>
                    <td>Enter Your Name:</td>
                    <td>
                        <input type="text" name="Name" placeholder="Your full name" required>
                    </td>
                </tr>

                <tr>
                    <td>Enter Your Email:</td>
                    <td>
                        <input type="email" name="Email" placeholder="Your email" required>
                    </td>
                </tr>

                <tr>
                    <td>Message Subject:</td>
                    <td>
                        <input type="text" name="Subject" placeholder="Message subject" required>
                    </td>
                </tr>

                <tr>
                    <td>Enter Your Message:</td>
                    <td>
                        <textarea name="Message" placeholder="Write your message..." required></textarea>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <input type="checkbox" name="Copy">
                        E-mail a copy of this message to your own address.
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <button type="submit">Send</button>
                    </td>
                </tr>

            </table>

        </form>

        <a href="/hellen/hellencv.html" class="back-btn">&larr; Back to CV</a>

    </div>

    <footer>
        <p>&copy; 2026 Kerubo Hellen.</p>
        <p>All Rights Reserved.</p>
    </footer>

</body>

</html>
